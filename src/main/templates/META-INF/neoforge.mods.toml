# Mod Loading Info
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

# VillageCraft 3 Essentials Conifg
[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

# Access Transformer
[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

# Mixins
[[mixins]]
config="${mod_id}.mixins.json"

# Dependency for Minecraft
[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Dependency for NeoForge
[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

# Dependency for JEI
[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    versionRange="[19.27.0.336,)"
    ordering="AFTER"
    side="BOTH"

# Dependency for Luckperms
[[dependencies.${mod_id}]]
    modId="luckperms"
    type="optional"
    versionRange="[5.4.140,)"
    ordering="AFTER"
    side="SERVER"

# Dependency for Farmer's Delight
[[dependencies.${mod_id}]]
    modId="farmersdelight"
    type="optional"
    versionRange="[1.2.11a,)"
    ordering="AFTER"
    side="BOTH"

# Dependency for Aquaculture 2
[[dependencies.${mod_id}]]
    modId="aquaculture"
    type="optional"
    versionRange="[2.7.21,)"
    ordering="AFTER"
    side="BOTH"

# Dependency for Better Archeology
[[dependencies.${mod_id}]]
    modId="betterarcheology"
    type="optional"
    versionRange="[1.3.4,)"
    ordering="AFTER"
    side="BOTH"