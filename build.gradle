plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.146'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenCentral()

    maven {url 'https://maven.wispforest.io/releases' }
    maven {url 'https://maven.su5ed.dev/releases' }
    maven {url 'https://maven.fabricmc.net' }
    maven {url "https://girafi.dk/maven/"}
    maven {url "https://repo.erdbeerbaerlp.de/repository/maven-public/"}
    maven {url "https://repo.bluecolored.de/releases"}
    maven {url "https://maven.createmod.net" }
    maven {url "https://maven.ithundxr.dev/snapshots" }

    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }

    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }

    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
}

base {
    archivesName = mod_id
}

// Java Language Version
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

configurations {
    runtimeClasspath.extendsFrom localRuntime
    datagenMods
}

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            gameDirectory = file('run/data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()

            // Add required mods for data generation
            programArguments.addAll '--existing-mod', 'farmersdelight'
            programArguments.addAll '--existing-mod', 'aquaculture'
            programArguments.addAll '--existing-mod', 'vanillabackport'
            programArguments.addAll '--existing-mod', 'platform'
            programArguments.addAll '--existing-mod', 'creategoggles'
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    // Accessories Dependency
    implementation("io.wispforest:accessories-neoforge:${accessories_version}") {
        exclude group: "com.flowpowered"
    }

    // JEI Dependency
    compileOnly("mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}")
    datagenMods("mezz.jei:jei-${mc_version}-neoforge:${jei_version}")

    // LuckPerms Dependency
    compileOnly("net.luckperms:api:5.5")

    // Farmer's Delight Dependency
    compileOnly("curse.maven:farmers-delight-398521:8083481")
    datagenMods("curse.maven:farmers-delight-398521:8083481")

    // Aquaculture 2 Dependency
    compileOnly("com.teammetallurgy.aquaculture:aquaculture2_${mc_version}:${mc_version}-${aquaculture_version}")
    datagenMods("com.teammetallurgy.aquaculture:aquaculture2_${mc_version}:${mc_version}-${aquaculture_version}")

    // Discord Integration Dependency
    compileOnly("de.erdbeerbaerlp:dcintegration.common:3.0.7")

    // Create: Brassworks Missions Dependency
    compileOnly("curse.maven:create-brassworks-missions-1348982:8561618")

    // Archers (RPG Series) Dependency
    compileOnly("curse.maven:archers-932359:8549422")

    // Spell Engine Dependency
    compileOnly("curse.maven:spell-engine-807653:8600773")

    // Tiny Config Dependency
    compileOnly("maven.modrinth:tiny-config:${project.tiny_config_version}-neoforge")

    // BlueMap Dependency
    compileOnly("de.bluecolored:bluemap-api:${project.bluemap_api_version}")
    datagenMods("de.bluecolored:bluemap-api:${project.bluemap_api_version}")

    // Vanilla Backport
    compileOnly("curse.maven:vanillabackport-417430:9318571")
    datagenMods("curse.maven:vanillabackport-417430:9318571")

    // Platform Dependency
    compileOnly("curse.maven:platform-997634:9318519")
    datagenMods("curse.maven:platform-997634:9318519")

    // Create Goggles Dependency
    compileOnly("curse.maven:create-goggles-377835:6776826")
    datagenMods("curse.maven:create-goggles-377835:6776826")

    // Create Dependencies
    compileOnly("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    datagenMods("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }

    // Ponder Dependency
    compileOnly("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    datagenMods("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")

    // Flywheel Dependency
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")

    // Registrate Dependency
    compileOnly("com.tterrag.registrate:Registrate:${registrate_version}")
    datagenMods("com.tterrag.registrate:Registrate:${registrate_version}")

    // Architectury API
    datagenMods("curse.maven:architectury-api-419699:9608861")
}

// gradle.properties entries
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            accessories_version    : accessories_version,
            jei_version            : jei_version,
            aquaculture_version    : aquaculture_version,
            tiny_config_version    : tiny_config_version,
            bluemap_api_version    : bluemap_api_version,
            mc_version             : mc_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_credits            : mod_credits,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

tasks.register('copyDatagenMods', Sync) {
    from configurations.datagenMods
    into layout.projectDirectory.dir('run/data/mods')
}

tasks.named('processResources').configure {
    dependsOn 'copyDatagenMods'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}